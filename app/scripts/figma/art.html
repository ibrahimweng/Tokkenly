<!doctype html><meta charset="utf-8"><title>art</title>
<link rel="stylesheet" href="/src/styles/tokens.css">
<link rel="stylesheet" href="/src/styles/components.css">
<style>
  body { margin:0; background:var(--canvas); color:var(--ink); font:13px system-ui; }
  .artsheet { display:grid; grid-template-columns:repeat(4,206px); gap:16px; padding:20px; justify-content:start; }
  .artcell { background:var(--sunken); --art-ground:var(--sunken); border-radius:16px;
          padding:12px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .artcell .artbox { width:180px; height:180px; color:var(--ink); opacity:.9; }
  .artcell.sm .artbox { width:124px; height:96px; color:var(--muted); opacity:.8; }
  .artcell svg { display:block; width:100%; height:100%; }
  .artcell b { font-weight:600; color:var(--muted); font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
</style>
<div class="artsheet" id="s"></div>
<script type="module">
  import * as D from '/src/components/drawings.ts'
  const s = document.getElementById('s')
  const big = ['INVEST','WALLET','GROW','SPEND','LEND','BORROW']
  const small = ['NO_ACTIVITY','NO_HOLDINGS','NO_BUCKET','NO_MATCH','NO_PEOPLE']
  for (const k of [...big, ...small]) {
    const c = document.createElement('div')
    c.className = 'artcell' + (small.includes(k) ? ' sm' : '')
    const box = document.createElement('div'); box.className = 'artbox'
    box.appendChild(D[k]())
    const b = document.createElement('b'); b.textContent = k
    c.append(box, b); s.appendChild(c)
  }
  document.documentElement.dataset.ready = '1'
</script>
