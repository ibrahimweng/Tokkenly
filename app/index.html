<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" />
    <title>Tokkenly</title>
    <!-- Geist is served from /fonts now, so there is no third party in the
         critical path and no session that renders in the fallback because a
         CDN was slow. The latin subset is preloaded because every screen uses
         it; latin-ext waits until something needs a ₦. -->
    <link
      rel="preload"
      href="/fonts/geist-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
